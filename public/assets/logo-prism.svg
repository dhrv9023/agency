<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyan Neon Energy Glow -->
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neonEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- LEFT WING GRADIENTS (Dark Titanium / Stealth Obsidian) -->
    <!-- Left Top Cap -->
    <linearGradient id="leftCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6275" />
      <stop offset="100%" stop-color="#2a2d36" />
    </linearGradient>

    <!-- Left Outer Facet (Shadowed Matte Charcoal) -->
    <linearGradient id="leftOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c303a" />
      <stop offset="40%" stop-color="#1a1c23" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Left Inner Facet (Deep Obsidian Core) -->
    <linearGradient id="leftInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="60%" stop-color="#101217" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- RIGHT WING GRADIENTS (Brushed Platinum / Mirror Chrome) -->
    <!-- Right Top Cap -->
    <linearGradient id="rightCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Right Inner Facet (Brilliant Chrome Reflection) -->
    <linearGradient id="rightInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Right Outer Facet (Silver Steel Shading) -->
    <linearGradient id="rightOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Ambient Backlight Aura -->
  <path d="M 38 46 L 58 33 L 76 46 L 100 102 L 124 46 L 142 33 L 162 46 L 100 174 Z"
        fill="none" stroke="url(#neonEdge)" stroke-width="3" stroke-linejoin="round"
        filter="url(#cyberGlow)" opacity="0.65" />

  <!-- The Precision Sculpted 'V' Mark -->
  <g id="varah-prism">
    <!-- LEFT WING -->
    <!-- Left Outer Facet -->
    <polygon points="40,46 58,35 100,170 82,170"
             fill="url(#leftOuterGrad)" stroke="#1a1c23" stroke-width="0.5" />

    <!-- Left Inner Facet -->
    <polygon points="58,35 74,46 100,98 100,170"
             fill="url(#leftInnerGrad)" stroke="#101217" stroke-width="0.5" />

    <!-- Left Top Cap Facet -->
    <polygon points="40,46 58,35 74,46"
             fill="url(#leftCapGrad)" stroke="#383d49" stroke-width="0.5" />

    <!-- RIGHT WING -->
    <!-- Right Outer Facet -->
    <polygon points="160,46 142,35 100,170 118,170"
             fill="url(#rightOuterGrad)" stroke="#64748b" stroke-width="0.5" />

    <!-- Right Inner Facet -->
    <polygon points="142,35 126,46 100,98 100,170"
             fill="url(#rightInnerGrad)" stroke="#cbd5e1" stroke-width="0.5" />

    <!-- Right Top Cap Facet -->
    <polygon points="160,46 142,35 126,46"
             fill="url(#rightCapGrad)" stroke="#e2e8f0" stroke-width="0.5" />

    <!-- Center Spine Highlight (Sharp Razor Ridge) -->
    <line x1="142" y1="35" x2="100" y2="170" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
    <line x1="58" y1="35" x2="100" y2="170" stroke="#475569" stroke-width="0.8" opacity="0.8" />
    
    <!-- Central Valley Crease -->
    <line x1="100" y1="98" x2="100" y2="170" stroke="#00f0ff" stroke-width="0.8" opacity="0.75" />
  </g>
</svg>