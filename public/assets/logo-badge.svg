<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="badgeGlowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1118" />
      <stop offset="85%" stop-color="#050608" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circular Housing -->
  <circle cx="50" cy="50" r="48" fill="url(#badgeGlowBg)" stroke="url(#badgeBorder)" stroke-width="1.5" />
  
  <!-- Centered Scaled Prism V Mark -->
  <g transform="translate(14, 14) scale(0.36)">
    <!-- Left Arm -->
    <polygon points="36,48 56,34 76,48" fill="#64748b" />
    <polygon points="36,48 56,34 100,174 88,174" fill="#1e222d" />
    <polygon points="56,34 76,48 100,102 100,174" fill="#0d0e14" />
    <!-- Right Arm -->
    <polygon points="164,48 144,34 124,48" fill="#ffffff" />
    <polygon points="144,34 124,48 100,102 100,174" fill="#e2e8f0" />
    <polygon points="164,48 144,34 100,174 112,174" fill="#94a3b8" />
    <!-- Center Crease & Highlights -->
    <line x1="144" y1="34" x2="100" y2="174" stroke="#ffffff" stroke-width="2.5" />
    <line x1="100" y1="102" x2="100" y2="174" stroke="#00f0ff" stroke-width="2" />
  </g>
</svg>