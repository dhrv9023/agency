<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for dark containers -->
    <linearGradient id="varahBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Chrome / Platinum Gradient (Right wing) -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Chrome Inner Highlight -->
    <linearGradient id="chromeLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Obsidian / Black Titanium Gradient (Left wing) -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333846" />
      <stop offset="40%" stop-color="#1e212b" />
      <stop offset="80%" stop-color="#12141a" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>

    <!-- Obsidian Top Chamfer -->
    <linearGradient id="obsidianTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5061" />
      <stop offset="100%" stop-color="#1a1c24" />
    </linearGradient>

    <!-- Neural Cyan Cyber Glow Edge -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer ambient glow outline -->
  <g filter="url(#glowFilter)">
    <!-- Cyan luminous energy silhouette path -->
    <path d="M 38 42 L 68 42 L 100 138 L 132 42 L 162 42 L 106 172 C 103 178 97 178 94 172 Z"
          fill="none" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- Main 3D Faceted V Emblem -->
  <g id="varah-v-mark">
    <!-- LEFT WING: Obsidian Black Titanium -->
    <!-- Left outer chamfer/facet -->
    <path d="M 40 44 L 68 44 L 99 144 L 80 144 Z"
          fill="url(#obsidianGrad)" stroke="#222634" stroke-width="0.5" />
    
    <!-- Left top cut/facet -->
    <polygon points="40,44 68,44 60,54 48,54"
             fill="url(#obsidianTop)" />
             
    <!-- Left core body -->
    <path d="M 48 54 L 60 54 L 99 166 L 94 166 Z"
          fill="#111317" />
          
    <!-- Left inner edge bevel highlight -->
    <line x1="99" y1="144" x2="99" y2="166" stroke="#4a5568" stroke-width="1" />

    <!-- RIGHT WING: Polished Platinum & Titanium Chrome -->
    <!-- Right outer main reflection facet -->
    <path d="M 160 44 L 132 44 L 101 144 L 120 144 Z"
          fill="url(#chromeGrad)" stroke="#cbd5e1" stroke-width="0.5" />

    <!-- Right top cut/facet -->
    <polygon points="160,44 132,44 140,54 152,54"
             fill="#ffffff" />

    <!-- Right core reflective body -->
    <path d="M 140 54 L 152 54 L 106 166 L 101 166 Z"
          fill="url(#chromeLight)" />

    <!-- Center Apex Seam & Diamond Core Accent -->
    <polygon points="100,136 105,148 100,168 95,148"
             fill="#ffffff" opacity="0.95" />
             
    <!-- Apex Spark/Node -->
    <circle cx="100" cy="148" r="1.5" fill="#38bdf8" />
  </g>
</svg>