<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Emblem Filters & Gradients -->
    <linearGradient id="hLeftOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="60%" stop-color="#1e222d" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="hLeftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21242e" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <linearGradient id="hRightInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="hRightOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="hAura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Group: The Emblem (Scaled to height 120px) -->
  <g transform="translate(15, 12) scale(0.85)">
    <!-- Cyan Outline Aura -->
    <path d="M 36 48 L 56 34 L 76 48 L 100 106 L 124 48 L 144 34 L 164 48 L 100 178 Z"
          fill="none" stroke="url(#hAura)" stroke-width="2.5" filter="url(#hGlow)" />
    <!-- Left Arm -->
    <polygon points="36,48 56,34 76,48" fill="#64748b" />
    <polygon points="36,48 56,34 100,174 88,174" fill="url(#hLeftOuter)" stroke="#1e222d" stroke-width="0.5" />
    <polygon points="56,34 76,48 100,102 100,174" fill="url(#hLeftInner)" />
    <!-- Right Arm -->
    <polygon points="164,48 144,34 124,48" fill="#ffffff" />
    <polygon points="144,34 124,48 100,102 100,174" fill="url(#hRightInner)" />
    <polygon points="164,48 144,34 100,174 112,174" fill="url(#hRightOuter)" />
    <!-- Spine Glints -->
    <line x1="144" y1="34" x2="100" y2="174" stroke="#ffffff" stroke-width="1.2" />
    <line x1="100" y1="102" x2="100" y2="174" stroke="#00f0ff" stroke-width="0.9" opacity="0.8" />
  </g>

  <!-- Divider Rule -->
  <line x1="185" y1="42" x2="185" y2="138" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2" />

  <!-- Typography: Wordmark "VARAH" -->
  <text x="220" y="98"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="0.28em"
        fill="#ffffff">VARAH</text>

  <!-- Subtitle Tagline: "AI SYSTEMS &amp; AUTOMATION" -->
  <text x="225" y="132"
        font-family="'SF Mono', 'Fira Code', 'Roboto Mono', monospace"
        font-size="14"
        font-weight="500"
        letter-spacing="0.46em"
        fill="#94a3b8">AI SYSTEMS &amp; AUTOMATION</text>
</svg>