<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" fill="none">
  <title>VARAH SYSTEMS — LinkedIn Banner</title>
  <defs>
    <style>
      .bg { fill: #040508; }
      .brand { font-family: 'Inter', -apple-system, sans-serif; font-size: 64px; font-weight: 800; fill: #ffffff; letter-spacing: 0.12em; }
      .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #00f0ff; letter-spacing: 0.2em; text-transform: uppercase; }
      .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.12em; }
      .pills { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .divider { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; }
    </style>
  </defs>

  <!-- Deep Obsidian Solid Background -->
  <rect width="1584" height="396" class="bg" />

  <!-- Center / Right Typography Lockup -->
  <g transform="translate(380, 0)">
    <!-- Brand Category Pill -->
    <rect x="0" y="80" width="230" height="28" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.25)" />
    <text x="16" y="99" class="eyebrow">AI AUTOMATION AGENCY</text>

    <!-- Main Wordmark -->
    <text x="0" y="180" class="brand">VARAH SYSTEMS</text>

    <!-- Subtitle / Approved Homepage Positioning Line -->
    <text x="2" y="222" class="subtitle">INTELLIGENT SYSTEMS THAT SCALE YOUR BUSINESS</text>

    <!-- Hairline Divider -->
    <line x1="2" y1="250" x2="680" y2="250" class="divider" />

    <!-- Capability Indicators -->
    <g transform="translate(2, 280)" class="pills">
      <text x="0" y="0">&bull; Autonomous Agents</text>
      <text x="180" y="0">&bull; Inbound Qualification</text>
      <text x="380" y="0">&bull; Document Intelligence</text>
    </g>
  </g>

  <!-- Concept 1 Binary Convergent V Mark on Right -->
  <g transform="translate(1200, 78) scale(5)">
    <polygon points="2,4 16,4 27,39 16,39" fill="#94a3b8" />
    <polygon points="46,4 32,4 21,39 32,39" fill="#ffffff" />
    <polygon points="19.5,38 24,45 28.5,38 24,31" fill="#00f0ff" />
    <rect x="22.5" y="8" width="3" height="20" rx="1.5" fill="#00f0ff" />
  </g>
</svg>